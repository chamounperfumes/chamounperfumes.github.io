name: Publicar loja

# Site da LOJA FÍSICA (chamounperfumes.github.io/loja/), separado do site principal.
# Toda vez que o painel da loja (ou o Claude) grava em loja/dados/ ou loja/img/, este robô
# monta o bloco de dados de loja/index.html e publica (a loja não tem PDF).
on:
  push:
    branches: [main]
    paths: ['loja/dados/**', 'loja/img/**', 'loja/ferramentas/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-loja
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: echo "Sem dependências extras."
      - name: Monta a tabela da loja
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%d/%m/%Y)
          python3 -I loja/ferramentas/montar_dados.py loja/dados/perfumes.json loja/dados/config.json "$HOJE"
      - name: Publica
        run: |
          git config user.name "Chamoun Perfumes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loja/index.html
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Loja: atualiza tabela de preços ($(TZ=America/Sao_Paulo date +%d/%m/%Y))"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
