<head>

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a quiet white header with the logo, a slim sticky bar (section filter + search),
   then a dense product grid: 3 per row on a phone, 4 on a tablet, 5 on a desktop.
   Clean light look only: product photos are shot on white, so the page stays light. */
:root{
  --page:#F4F4F2; --card:#FFFFFF; --ink:#121212; --soft:#6F6F6B; --faint:#9A9A95; --line:#E7E7E3;
  --chip:#ECECE8; --accent:#121212;
  --sans:'Plus Jakarta Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:lining-nums tabular-nums}

.top{background:var(--card)}
.top .wrap{padding-block:26px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.top img{width:min(220px,56vw);height:auto;display:block}
.top .upd{font-size:12px;color:var(--soft);font-weight:500}
.dl{text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-top:6px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer}
.dl svg{width:18px;height:18px;flex:none}
.dl[disabled]{opacity:.75;cursor:progress}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:10px;display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:4px;flex:1 1 auto;min-width:0;max-width:440px}
.seg button{flex:1 1 0;min-width:0;border:0;background:none;border-radius:999px;padding:7px 10px;min-height:36px;font-size:13px;font-weight:600;color:var(--soft);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 2px 8px -2px rgba(0,0,0,.35)}
.seg .c{font-weight:500;color:var(--faint);margin-left:3px;font-size:11.5px}
.seg button[aria-pressed="true"] .c{color:rgba(255,255,255,.7)}
.icon-btn{flex:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--chip);display:grid;place-items:center;cursor:pointer}
.icon-btn[aria-expanded="true"]{background:var(--ink);color:#fff}
.icon-btn svg{width:18px;height:18px}
.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:9px 14px;font-size:16px}

main section{scroll-margin-top:72px}
main.wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:26px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;background:var(--ink);color:#fff;border-radius:18px;padding:18px 18px 16px}
.sec-head .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.sec-head .eb{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.sec-head h2{margin:0;font-size:clamp(26px,7.4vw,38px);font-weight:800;letter-spacing:-.025em;line-height:1;color:#fff;text-transform:uppercase}
.sec-head .n{flex:none;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border-radius:999px;padding:7px 12px;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:clamp(10.5px,2.9vw,13px)}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}}
.card{background:var(--card);border-radius:14px;display:flex;flex-direction:column;padding:.55em .7em .85em;min-width:0}
.ph{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;margin-bottom:.5em}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.ph .none{position:absolute;left:30%;top:14%;width:40%;height:72%;border-radius:8px;background:var(--chip)}
.mk{font-size:.74em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{margin-top:.2em;font-size:1.04em;font-weight:600;line-height:1.22;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mt{margin-top:.2em;font-size:.86em;color:var(--soft)}
.pr{margin-top:auto;padding-top:.65em;display:flex;flex-direction:column;gap:.18em}
.v{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.35em;row-gap:0}
.v b{font-size:1.26em;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.v span{font-size:.8em;font-weight:600;color:var(--soft)}
.a{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.35em;row-gap:0}
.a b{font-size:1.08em;font-weight:700;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.a span{font-size:.8em;font-weight:600;color:var(--soft)}
.x{font-size:.86em;color:var(--soft);line-height:1.3}
.x b{font-weight:700;color:var(--ink);white-space:nowrap}
.empty{text-align:center;color:var(--soft);padding:40px 0}
footer .wrap{padding-block:10px 36px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--faint);font-size:12px;text-align:center}
footer img{width:120px;height:auto;opacity:.75}

/* ---------- Assistente + ficha do perfume ---------- */
.top .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.top .acts .dl{margin-top:0}
.ask{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:9px 18px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer}
.ask svg,.fab svg{width:18px;height:18px;flex:none}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:12px 18px;min-height:48px;font-weight:700;font-size:14px;box-shadow:0 12px 28px -10px rgba(0,0,0,.55);cursor:pointer;transition:opacity .2s ease,transform .2s ease}
.fab.off{opacity:0;transform:translateY(14px);pointer-events:none}
.top .hint{font-size:12px;color:var(--faint)}
.card{cursor:pointer;transition:transform .12s ease}
.card:active{transform:scale(.985)}

/* Folha por cima da página. No iPhone, com a barra do Safari recolhida, a área visível fica maior que
   a "janela" usada por elementos fixos: por isso a altura vem do JS (visualViewport), o fundo escuro
   passa das bordas e a folha tem um prolongamento branco para baixo — nunca sobra faixa da página. */
.ov{position:fixed;left:0;right:0;top:0;height:100%;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.ov[hidden]{display:none}
.ov-bg{position:absolute;left:0;right:0;top:-50vh;bottom:-50vh;background:rgba(18,18,18,.42);touch-action:none}
.sheet{position:relative;width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px -12px rgba(0,0,0,.35)}
.sheet::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 1px);height:50vh;background:var(--card);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.ov:not([hidden]) .sheet{animation:sobe .2s ease-out}@keyframes sobe{from{transform:translateY(28px)}}}
@media (min-width:700px){.ov{justify-content:center}.sheet{border-radius:22px;max-height:88%}.sheet::after{display:none}}
#sh-t:focus{outline:none}
.sh-h{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line);flex:none;touch-action:none}
.sh-h h2{flex:1;min-width:0;margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-i{flex:none;width:40px;height:40px;border-radius:999px;border:0;background:var(--chip);display:grid;place-items:center;cursor:pointer}
.sh-i svg{width:18px;height:18px}
#sh-back{margin-left:-8px}
.sh-b{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 18px calc(28px + env(safe-area-inset-bottom,0px));flex:1 1 auto;min-height:0}

.lead{margin:0 0 12px;font-size:14px;color:var(--soft)}
.af{display:flex;gap:8px}
.af input{flex:1;min-width:0;min-height:48px;border:1.5px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:16px;background:var(--card)}
.af button{flex:none;min-height:48px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;padding:0 16px;cursor:pointer}
.lbl{display:block;margin:16px 0 7px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 18px;margin:0 -18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;min-height:38px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.neg{border-style:dashed;border-color:var(--ink)}
.chips .sep{flex:none;width:1px;background:var(--line);margin:6px 2px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sug{border:0;background:var(--chip);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer;text-align:left}
.sum{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 0 2px;padding-top:16px;border-top:2px solid var(--ink)}
.sum p{margin:0;font-size:14px;font-weight:700;line-height:1.35}
.sum p span{font-weight:500;color:var(--soft)}
.sum button{flex:none;background:none;border:0;padding:4px 0;color:var(--soft);text-decoration:underline;font-size:13px;cursor:pointer}
.res{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;align-items:start}
.rph{position:relative;width:78px;aspect-ratio:1/1;background:var(--card)}
.rph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.res .mk{font-size:10.5px}
.res .nm{font-size:15px;-webkit-line-clamp:2}
.res .mt{font-size:12px}
.flag{display:inline-block;margin-bottom:5px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:6px;padding:3px 7px}
.why{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tg{font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:3px 9px}
.tg.l{background:var(--chip);color:var(--ink);font-weight:600}
.nt{font-size:12px;color:var(--soft);margin-top:6px;line-height:1.4}
.pp{font-size:12.5px;margin-top:7px;line-height:1.45;color:var(--soft)}
.pp b{font-weight:800;color:var(--ink)}
.nw{white-space:nowrap}
.more{display:block;width:100%;margin-top:14px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;cursor:pointer}
.none-msg{margin:18px 0 0;font-size:14px;color:var(--soft)}
.src{margin:22px 0 0;font-size:11.5px;color:var(--faint);line-height:1.45}
.src a{color:inherit}

.dt{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:center}
.dt .rph{width:118px}
.dt .mk{font-size:11px}
.dt h3{margin:.2em 0 0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.12}
.dt .mt{font-size:13px;margin-top:4px}
.occ{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:700;background:var(--chip);border-radius:999px;padding:5px 11px}
.sz{display:grid;gap:8px;margin-top:16px}
.sz>div{background:var(--page);border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sz .ml{font-weight:800;font-size:14px}
.sz .pv{text-align:right;font-size:12.5px;color:var(--soft);line-height:1.45}
.sz .pv b{font-size:16px;font-weight:800;color:var(--ink)}
.sz .pv i{font-style:normal;font-weight:700;color:var(--ink)}
.h4{margin:22px 0 9px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.acc{display:flex;flex-wrap:wrap;gap:6px}
.acc .tg{font-size:12.5px;padding:5px 11px}
.nts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:14px;line-height:1.4}
.nts dt{font-weight:700}
.nts dd{margin:0}
</style>
</head>

  <div class="wrap">

    <div class="sh-b" id="sh-b"></div>
  </div>

<script>
(() => {
  let D; try { D = JSON.parse(document.getElementById('dados').textContent); } catch { D = { produtos: [], secoes: [] }; }
  const N = Number(D.parcelas) || 6;
  const secoes = (D.secoes && D.secoes.length ? D.secoes : [...new Set(D.produtos.map((p) => p.secao))]);
  const money = (v) => Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const parc = (t) => Math.floor(Math.round(Number(t) * 100) / N) / 100;
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
  if (D.atualizado_em) { document.getElementById('upd').textContent = 'Tabela de preços · atualizada em ' + D.atualizado_em; document.getElementById('upd2').textContent = 'Atualizada em ' + D.atualizado_em; }

  let sec = 'Todos', q = '';
  try { const h = decodeURIComponent(location.hash.slice(1)); const m = secoes.find((s) => norm(s) === norm(h)); if (m) sec = m; } catch {}

  function seg() {
    const box = document.getElementById('seg'); box.replaceChildren();
    for (const s of ['Todos', ...secoes]) {
      const n = s === 'Todos' ? D.produtos.length : D.produtos.filter((p) => p.secao === s).length;
      const b = el('button', '', s); b.type = 'button'; b.setAttribute('aria-pressed', String(sec === s));
      b.append(el('span', 'c num', String(n)));
      b.onclick = () => { sec = s; seg(); render(); window.scrollTo({ top: document.querySelector('.bar').offsetTop, behavior: 'auto' }); };
      box.append(b);
    }
  }
  function card(p) {
    const a = el('article', 'card');
    const ph = el('div', 'ph');
    if (p.img) { const i = el('img'); i.src = p.img; i.alt = p.marca + ' ' + p.nome; i.loading = 'lazy'; i.decoding = 'async'; ph.append(i); }
    else ph.append(el('span', 'none'));
    const pr = el('div', 'pr num');
    const v = el('div', 'v'); v.append(el('b', '', 'R$ ' + money(p.vista)), el('span', '', 'à vista'));
    const ap = el('div', 'a'); ap.append(el('b', '', 'R$ ' + money(p.parcelado)), el('span', '', 'a prazo'));
    const x = el('div', 'x'); x.append('em até ' + N + 'x de ', el('b', '', 'R$ ' + money(parc(p.parcelado))));
    pr.append(v, ap, x);
    a.append(ph, el('div', 'mk', p.marca), el('div', 'nm', p.nome), el('div', 'mt', [p.ml ? p.ml + ' ml' : '', p.tipo].filter(Boolean).join(' · ')), pr);
    a.tabIndex = 0; a.setAttribute('role', 'button'); a.setAttribute('aria-label', p.marca + ' ' + p.nome + ' — ver notas e preços');
    a.onclick = () => abrirDetalhe(p._g);
    a.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrirDetalhe(p._g); } };
    return a;
  }
  function render() {
    const main = document.getElementById('main'); main.replaceChildren();
    const words = norm(q).split(/\s+/).filter(Boolean);
    let shown = 0;
    for (const s of secoes) {
      if (sec !== 'Todos' && sec !== s) continue;
      const ps = D.produtos.filter((p) => p.secao === s && words.every((w) => norm([p.marca, p.nome, p.tipo, p.ml + 'ml'].join(' ')).includes(w)));
      if (!ps.length) continue; shown += ps.length;
      const section = el('section'); section.setAttribute('aria-label', s);
      const head = el('div', 'sec-head'); const t = el('div', 't'); t.append(el('span', 'eb', 'Perfumes'), el('h2', '', s)); head.append(t, el('span', 'n num', ps.length + (ps.length === 1 ? ' perfume' : ' perfumes')));
      const grid = el('div', 'grid'); ps.forEach((p) => grid.append(card(p)));
      section.append(head, grid); main.append(section);
    }
    if (!shown) main.append(el('p', 'empty', D.produtos.length ? 'Nenhum perfume encontrado para “' + q + '”.' : 'A tabela está sendo atualizada. Volte em instantes.'));
  }
  const sb = document.getElementById('search-btn'), sr = document.getElementById('search'), qi = document.getElementById('q');
  sb.onclick = () => { const open = sr.hidden; sr.hidden = !open; sb.setAttribute('aria-expanded', String(open)); if (open) qi.focus(); else if (q) { q = ''; qi.value = ''; render(); } };
  qi.addEventListener('input', (e) => { q = e.target.value; render(); });
  /* ---------- Link do PDF: muda a versão sempre que a tabela muda, para o celular não mostrar um PDF antigo ---------- */
  const dl = document.getElementById('dl');
  if (dl) {
    const txt = document.getElementById('dados').textContent; let h = 0;
    for (let i = 0; i < txt.length; i++) h = (h * 31 + txt.charCodeAt(i)) | 0;
    dl.href = 'catalogo.pdf?v=' + (h >>> 0).toString(36);
    if (D.atualizado_em) dl.setAttribute('download', 'Catalogo-Chamoun-' + D.atualizado_em.replace(/\//g, '-') + '.pdf');
  }

  /* =====================================================================
     Assistente "Me ajuda a escolher" + ficha do perfume.
     Funciona só no navegador, sem custo: cada perfume traz seus acordes e
     notas (do Fragrantica, traduzidos) e o texto do cliente é interpretado
     por palavras-chave (doce, fresco, noite, até R$ 300, parecido com...).
     ===================================================================== */
  const ESTILOS = [['doce', 'Doce'], ['baunilha', 'Baunilha'], ['fresco', 'Fresco'], ['citrico', 'Cítrico'], ['aquatico', 'Aquático'],
    ['amadeirado', 'Amadeirado'], ['floral', 'Floral'], ['frutado', 'Frutado'], ['especiado', 'Especiado'], ['oriental', 'Oriental (âmbar)'],
    ['atalcado', 'Atalcado'], ['couro', 'Couro e tabaco'], ['aromatico', 'Aromático'], ['marcante', 'Marcante'], ['suave', 'Suave']];
  const NOME_TAG = Object.assign(Object.fromEntries(ESTILOS), { caramelo: 'Caramelo', chocolate: 'Chocolate', cafe: 'Café', mel: 'Mel', coco: 'Coco', rosa: 'Rosa', lavanda: 'Lavanda', tabaco: 'Tabaco', almiscarado: 'Almiscarado', verde: 'Verde' });
  // Acorde (como vem do banco, em português) -> quanto ele soma em cada estilo.
  const ACC = {
    'doce': { doce: 1 }, 'baunilha': { baunilha: 1, doce: .55 }, 'caramelo': { doce: 1, caramelo: 1 }, 'mel': { doce: .8, mel: 1 },
    'cera de abelha': { mel: .6, doce: .4 }, 'chocolate': { doce: .9, chocolate: 1 }, 'cacau': { doce: .8, chocolate: 1 },
    'lactonico': { doce: .5 }, 'amendoa': { doce: .5 }, 'rum': { doce: .3, oriental: .2 }, 'alcoolico': { oriental: .2 },
    'coco': { coco: 1, doce: .4 }, 'tropical': { frutado: .8, doce: .3 },
    'citrico': { citrico: 1, fresco: .7 }, 'fresco': { fresco: 1 }, 'verde': { verde: 1, fresco: .5 },

    b.append(foto(p), info);
    return b;
  }

  /* ---------- Tela: assistente ---------- */
  let resBox = null, chipsBox = null, campo = null;
  function telaAssistente() {
    shT.textContent = 'Me ajuda a escolher';
    shB.replaceChildren();
    shB.append(el('p', 'lead', 'Conte o que você procura e eu separo as opções da nossa tabela.'));
    const f = el('form', 'af'); f.setAttribute('role', 'search');
    campo = el('input'); campo.type = 'text'; campo.placeholder = 'Ex.: perfume doce pra noite'; campo.setAttribute('enterkeyhint', 'search'); campo.setAttribute('aria-label', 'O que você procura?'); campo.autocomplete = 'off'; campo.value = Atexto;
    const bt = el('button', '', 'Buscar'); bt.type = 'submit';
    f.append(campo, bt);
    f.onsubmit = (e) => { e.preventDefault(); Atexto = campo.value.trim(); A = interpretar(Atexto); Alim = 8; desenharChips(); desenharResultados(); campo.blur(); if (resBox) resBox.scrollIntoView({ block: 'start', behavior: 'smooth' }); };
    shB.append(f);
    chipsBox = el('div'); shB.append(chipsBox);
    resBox = el('div'); resBox.setAttribute('aria-live', 'polite'); shB.append(resBox);
    const src = el('p', 'src');
    src.append('Acordes e notas de cada perfume com base no ', Object.assign(el('a', '', 'Fragrantica'), { href: 'https://www.fragrantica.com.br/', target: '_blank', rel: 'noopener' }), '. As sugestões são automáticas — na dúvida, chame a gente que ajudamos a escolher.');
    shB.append(src);
    desenharChips(); desenharResultados();
  }
  function chip(rotulo, ativo, onClick, cls) { const c = el('button', 'chip' + (cls ? ' ' + cls : ''), rotulo); c.type = 'button'; c.setAttribute('aria-pressed', String(!!ativo)); c.onclick = onClick; return c; }
  function mudou() { Alim = 8; desenharChips(); desenharResultados(); }
  function desenharChips() {
    chipsBox.replaceChildren();
    chipsBox.append(el('span', 'lbl', 'Estilo'));
    const r1 = el('div', 'chips');
    for (const [k, rot] of ESTILOS) {
      const neg = A.neg.has(k), on = A.tags.has(k);
      r1.append(chip(neg ? 'Sem ' + rot.toLowerCase() : rot, on || neg, () => {
        if (neg) A.neg.delete(k); else if (on) A.tags.delete(k); else { A.tags.add(k); if (k === 'marcante') A.tags.delete('suave'); if (k === 'suave') A.tags.delete('marcante'); }
        mudou();
      }, neg ? 'neg' : ''));
    }
    chipsBox.append(r1);
    chipsBox.append(el('span', 'lbl', 'Para quem, quando e quanto'));
    const r2 = el('div', 'chips');
    r2.append(chip('Masculino', A.secao === 'Masculinos', () => { A.secao = A.secao === 'Masculinos' ? '' : 'Masculinos'; mudou(); }),
      chip('Feminino', A.secao === 'Femininos', () => { A.secao = A.secao === 'Femininos' ? '' : 'Femininos'; mudou(); }), el('span', 'sep'),
      chip('Dia', A.occ === 'dia', () => { A.occ = A.occ === 'dia' ? '' : 'dia'; mudou(); }),
      chip('Noite', A.occ === 'noite', () => { A.occ = A.occ === 'noite' ? '' : 'noite'; mudou(); }), el('span', 'sep'));
    for (const v of [300, 500, 700]) r2.append(chip('Até R$ ' + v, A.max === v, () => { A.max = A.max === v ? 0 : v; A.barato = false; mudou(); }));
    if (A.max && ![300, 500, 700].includes(A.max)) r2.append(chip('Até R$ ' + A.max, true, () => { A.max = 0; mudou(); }));
    r2.append(el('span', 'sep'), chip('Árabes', A.arabe, () => { A.arabe = !A.arabe; mudou(); }));
    chipsBox.append(r2);
  }
  function resumo(st, n) {
    const partes = [];
    if (st.alvo && st.alvo.length) partes.push(st.parecido ? 'parecidos com ' + st.alvo[0].p.nome : st.alvo[0].p.nome + ' e parecidos');
    st.tags.forEach((t) => partes.push((NOME_TAG[t] || t).toLowerCase()));
    st.neg.forEach((t) => partes.push('sem ' + (NOME_TAG[t] || t).toLowerCase()));
    st.livres.forEach((w) => partes.push('com ' + w));
    if (st.occ) partes.push(st.occ === 'dia' ? 'para o dia' : 'para a noite');
    if (st.secao) partes.push(st.secao === 'Masculinos' ? 'masculinos' : 'femininos');
    if (st.arabe) partes.push('árabes');
    st.marcas.forEach((m) => { const g = grupos.find((x) => norm(x.p.marca).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').includes(m)); partes.push(g ? g.p.marca : m); });
    if (st.max) partes.push('até R$ ' + st.max); else if (st.barato) partes.push('mais em conta');
    return partes.join(' · ');
  }
  function desenharResultados() {
    resBox.replaceChildren();
    if (!temCriterio(A)) {
      resBox.append(el('span', 'lbl', 'Experimente perguntar'));
      const s = el('div', 'sugs');
      ['Procuro um perfume mais doce', 'Fresco para o dia a dia, masculino', 'Parecido com Sauvage', 'Feminino floral até R$ 500', 'Árabe amadeirado', 'Marcante para a noite, sem ser doce'].forEach((q) => {
        const b = el('button', 'sug', q); b.type = 'button';
        b.onclick = () => { campo.value = q; Atexto = q; A = interpretar(q); Alim = 8; desenharChips(); desenharResultados(); resBox.scrollIntoView({ block: 'start', behavior: 'smooth' }); };
        s.append(b);
      });
      resBox.append(s);
      return;
    }
    const lista = sugerir(A);
    const sm = el('div', 'sum'); const p = el('p');
    p.append(lista.length ? (lista.length === 1 ? '1 sugestão' : lista.length + ' sugestões') : 'Nada encontrado', el('span', '', ' — ' + resumo(A, lista.length)));
    const lim = el('button', '', 'Limpar'); lim.type = 'button'; lim.onclick = () => { A = estadoVazio(); Atexto = ''; campo.value = ''; mudou(); campo.focus(); };
    sm.append(p, lim); resBox.append(sm);
    if (!lista.length) { resBox.append(el('p', 'none-msg', 'Não achei nada com tudo isso junto. Tente tirar algum filtro ou escrever de outro jeito.')); return; }
    lista.slice(0, Alim).forEach((r, i) => resBox.append(linhaResultado(r, i === 0 && !r.proprio && lista.length > 1)));
    if (lista.length > Alim) { const m = el('button', 'more', 'Mostrar mais ' + Math.min(8, lista.length - Alim)); m.type = 'button'; m.onclick = () => { Alim += 8; desenharResultados(); }; resBox.append(m); }
  }

  /* ---------- Tela: ficha do perfume ---------- */
  function telaDetalhe(g) {
    const p = g.p, v = perfil(p);
    shT.textContent = p.marca;
    shB.replaceChildren();
    const top = el('div', 'dt'); const tx = el('div');
    tx.append(el('div', 'mk', p.marca), el('h3', '', p.nome), el('div', 'mt', [p.secao === 'Masculinos' ? 'Masculino' : p.secao === 'Femininos' ? 'Feminino' : p.secao, p.tipo].filter(Boolean).join(' · ')));
    if (v.ocasiao) tx.append(el('span', 'occ', OCASIAO[v.ocasiao]));
    top.append(foto(p), tx); shB.append(top);
    const sz = el('div', 'sz num');
    for (const t of g.tam) {
      const row = el('div'); const pv = el('div', 'pv');
      pv.append(el('b', '', 'R$ ' + money(t.vista)), ' à vista', el('br'), 'R$ ' + money(t.parcelado) + ' a prazo', el('br'), 'em até ' + N + 'x de ', el('i', '', 'R$ ' + money(parc(t.parcelado))));
      row.append(el('span', 'ml', t.ml ? t.ml + ' ml' : 'Preço'), pv); sz.append(row);
    }
    shB.append(sz);
    if (p.acordes && p.acordes.length) {
      shB.append(el('div', 'h4', 'Acordes principais'));
      const ac = el('div', 'acc'); p.acordes.slice(0, 8).forEach((a, i) => ac.append(el('span', 'tg' + (i < 3 ? '' : ' l'), a))); shB.append(ac);
    }
    const n = p.notas || {};
    if (n.topo || n.coracao || n.fundo || n.todas) {
      shB.append(el('div', 'h4', 'Notas'));
      const dl = el('dl', 'nts');
      [['Saída', n.topo], ['Coração', n.coracao], ['Fundo', n.fundo], ['Notas', n.todas]].forEach(([k, val]) => { if (val) dl.append(el('dt', '', k), el('dd', '', val)); });
      shB.append(dl);
    }
    if (v.tem) {
      const par = grupos.filter((x) => x !== g && x.p.secao === p.secao && norm(x.p.marca + x.p.nome) !== norm(p.marca + p.nome) && perfil(x.p).tem)
        .map((x) => ({ g: x, sim: cos(v, perfil(x.p)), hits: [], notasAchadas: [] })).filter((r) => r.sim >= .45).sort((a, b) => b.sim - a.sim)
        .filter((r, i) => r.sim >= .55 || i < 2).slice(0, 4);
      if (par.length) { shB.append(el('div', 'h4', 'Parecidos na nossa tabela')); par.forEach((r) => shB.append(linhaResultado(r, false))); }
    }
    if (/^https?:\/\//.test(p.fonte || '')) {
      const src = el('p', 'src'); let host = 'fonte';
      try { host = new URL(p.fonte).hostname.replace(/^www\./, ''); } catch {}
      src.append('Acordes e notas: ', Object.assign(el('a', '', /fragrantica/.test(host) ? 'Fragrantica' : host), { href: p.fonte, target: '_blank', rel: 'noopener' }), '.');
      shB.append(src);
    }
  }

  seg(); render();
})();
